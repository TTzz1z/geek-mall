server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Docker Compose DNS — allows upstream to appear after container start
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }

    location ~ ^/api/v1/ai/conversations/[^/]+/stream$ {
        set $gateway_upstream http://gateway:8080;
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 125s;
    }

    # Same-origin API proxy — avoids localhost vs 127.0.0.1 CORS breakage in local demo
    location /api/ {
        set $gateway_upstream http://gateway:8080;
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / { try_files $uri $uri/ /index.html; }
    location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; try_files $uri =404; }
}
