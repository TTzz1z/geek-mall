global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://host.docker.internal:8080/actuator/health
          - http://host.docker.internal:9001/actuator/health
          - http://host.docker.internal:9002/actuator/health
          - http://host.docker.internal:9003/actuator/health
          - http://host.docker.internal:9004/actuator/health
          - http://host.docker.internal:9005/actuator/health
          - http://host.docker.internal:9006/actuator/health
          - http://host.docker.internal:9007/actuator/health
          - http://host.docker.internal:9008/actuator/health
          - http://host.docker.internal:9009/actuator/health
          - http://host.docker.internal:9010/actuator/health
          - http://host.docker.internal:9011/actuator/health
          - http://host.docker.internal:8088/
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: spring-actuator
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8080
          - host.docker.internal:9001
          - host.docker.internal:9005
          - host.docker.internal:9011
        labels:
          env: local
