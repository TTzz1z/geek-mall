      ELASTICSEARCH_URL: http://elasticsearch:9200
      TIKA_URL: http://tika:9998
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET:-geek-product-documents}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-CHANGE_ME_MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-CHANGE_ME_MINIO_SECRET_KEY}
      EMBEDDING_URL: ${EMBEDDING_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      KNOWLEDGE_MINIMUM_SIMILARITY: ${KNOWLEDGE_MINIMUM_SIMILARITY:-0.62}
      KNOWLEDGE_REQUIRE_SEMANTIC_GATE: ${KNOWLEDGE_REQUIRE_SEMANTIC_GATE:-false}
      KNOWLEDGE_INDEX: ${KNOWLEDGE_INDEX:-geek-knowledge-v2}
      PRODUCT_SERVICE_URL: http://merchant-product:9002
      TRADE_SERVICE_URL: http://trade:9005
      SEARCH_SERVICE_URL: http://search-recommend:9004
      AFTERSALE_SERVICE_URL: http://aftersale:9008
      MEMBER_SERVICE_URL: http://member:9006
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-CHANGE_ME_INTERNAL_SERVICE_KEY}
      LLM_ENABLED: ${LLM_ENABLED:-true}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-60000}
      LLM_HEADER_TIMEOUT_MS: ${LLM_HEADER_TIMEOUT_MS:-15000}
      LLM_FIRST_BYTE_TIMEOUT_MS: ${LLM_FIRST_BYTE_TIMEOUT_MS:-15000}
      LLM_BODY_IDLE_TIMEOUT_MS: ${LLM_BODY_IDLE_TIMEOUT_MS:-15000}
      LLM_TOTAL_TIMEOUT_MS: ${LLM_TOTAL_TIMEOUT_MS:-60000}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-2048}
      AI_MODEL_PRIMARY: ${AI_MODEL_PRIMARY:-deepseek-v4-flash}
      AI_MODEL_FALLBACK: ${AI_MODEL_FALLBACK:-geek-chat-fallback}
      AI_MODEL_FAIL_PRIMARY: ${AI_MODEL_FAIL_PRIMARY:-false}
      NACOS_ADDR: nacos:8848
      JWT_SECRET: ${JWT_SECRET:-CHANGE_ME_JWT_SECRET_AT_LEAST_32_BYTES}
    expose: ["9011"]
    depends_on:
      <<: *security_check_depends
      mysql: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
      minio: { condition: service_healthy }
      tika: { condition: service_started }
      nacos: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9011'"]
      interval: 15s
      timeout: 5s
      retries: 20
  mall-web:
    build: { context: ./frontend, dockerfile: Dockerfile, args: { APP: mall-web } }
    ports: ["127.0.0.1:8088:80"]
    depends_on:
      <<: *security_check_depends
      gateway: { condition: service_healthy }
  admin-web:
    build: { context: ./frontend, dockerfile: Dockerfile, args: { APP: admin-web } }
    ports: ["127.0.0.1:8089:80"]
    depends_on:
      <<: *security_check_depends
      gateway: { condition: service_healthy }
  mobile-uniapp:
    build: { context: ./frontend, dockerfile: Dockerfile, args: { APP: mobile-uniapp } }
    ports: ["127.0.0.1:8090:80"]
    depends_on: *security_check_depends
  ops-screen:
    build: { context: ./frontend, dockerfile: Dockerfile, args: { APP: ops-screen } }
    ports: ["127.0.0.1:8091:80"]
    depends_on: *security_check_depends
volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  elasticsearch-data:
  minio-data:
