name: geek-mall

x-security-check-depends: &security_check_depends
  security-config-check:
    condition: service_completed_successfully

services:
  # This one-shot guard makes it impossible to accidentally use the repository
  # placeholders in a shared environment. Local demos are allowed, but noisy.
  security-config-check:
    image: alpine:3.20
    environment:
      GEEK_SHARED_ENVIRONMENT: ${GEEK_SHARED_ENVIRONMENT:-false}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-CHANGE_ME_MYSQL_ROOT_PASSWORD}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-CHANGE_ME_MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-CHANGE_ME_JWT_SECRET_AT_LEAST_32_BYTES}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-CHANGE_ME_INTERNAL_SERVICE_KEY}
      PAYMENT_CALLBACK_SECRET: ${PAYMENT_CALLBACK_SECRET:-CHANGE_ME_PAYMENT_CALLBACK_SECRET}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-CHANGE_ME_RABBITMQ_PASSWORD}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-CHANGE_ME_MINIO_SECRET_KEY}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-CHANGE_ME_MINIO_ACCESS_KEY}
      NACOS_USER: ${NACOS_USER:-CHANGE_ME_NACOS_USER}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-CHANGE_ME_NACOS_PASSWORD}
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-CHANGE_ME_NACOS_AUTH_TOKEN}
      NACOS_AUTH_ENABLE: ${NACOS_AUTH_ENABLE:-false}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-CHANGE_ME_NACOS_IDENTITY_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-CHANGE_ME_NACOS_IDENTITY_VALUE}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-CHANGE_ME_GRAFANA_ADMIN_PASSWORD}
    command:
      - /bin/sh
      - -ec
      - |
        invalid=''
        for key in MYSQL_ROOT_PASSWORD MYSQL_PASSWORD JWT_SECRET INTERNAL_SERVICE_KEY PAYMENT_CALLBACK_SECRET RABBITMQ_PASSWORD MINIO_ACCESS_KEY MINIO_SECRET_KEY NACOS_USER NACOS_PASSWORD NACOS_AUTH_TOKEN NACOS_AUTH_IDENTITY_KEY NACOS_AUTH_IDENTITY_VALUE GRAFANA_ADMIN_PASSWORD; do
          value="$$(printenv "$$key")"
          case "$$value" in
            ''|CHANGE_ME_*|change-*|geek_local_password|geek-isk-*|nacos|VGhpc0lzQVNlY3VyZUxvY2FsVG9rZW5Gb3JHZWVrTWFsbE5hY29z)
              invalid="$$invalid $$key" ;;
          esac
        done
        [ "$$NACOS_AUTH_ENABLE" = 'false' ] && invalid="$$invalid NACOS_AUTH_ENABLE"
        if [ -n "$$invalid" ]; then
          if [ "$$GEEK_SHARED_ENVIRONMENT" = 'true' ]; then
            echo "ERROR: refusing shared startup with placeholder/insecure configuration:$$invalid" >&2
            exit 1
          fi
          echo "WARNING: local-only startup uses placeholder/insecure configuration:$$invalid" >&2
        fi
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-CHANGE_ME_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-geek_system}
      MYSQL_USER: ${MYSQL_USER:-geek}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-CHANGE_ME_MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    expose: ["3306"]
    depends_on: *security_check_depends
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/mysql/init-databases.sql:/docker-entrypoint-initdb.d/01-geek-databases.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-change-root-password}"]
      interval: 10s
      timeout: 5s
      retries: 15
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    expose: ["6379"]
    depends_on: *security_check_depends
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-geek}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-CHANGE_ME_RABBITMQ_PASSWORD}
    expose: ["5672", "15672"]
    depends_on: *security_check_depends
    volumes: ["rabbitmq-data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    expose: ["9200"]
    depends_on: *security_check_depends
    volumes: ["elasticsearch-data:/usr/share/elasticsearch/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow || exit 1"]
      interval: 15s
      timeout: 8s
      retries: 30
  minio:
    image: ${MINIO_IMAGE:-ghcr.io/coollabsio/minio@sha256:a4938f37f1be1841b8e7b627ad0207b265345fd0d063e42d7410c78af0e63e68}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-CHANGE_ME_MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-CHANGE_ME_MINIO_SECRET_KEY}
    expose: ["9000", "9001"]
    depends_on: *security_check_depends
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 15
  tika:
    image: apache/tika:4.2.0-1-full
    command: ["-c", "/config/tika-config.json"]
    volumes: ["./deploy/tika/tika-config.json:/config/tika-config.json:ro"]
    expose: ["9998"]
    mem_limit: 2g
    cpus: 2
  nacos:
    image: nacos/nacos-server:v2.4.3
    environment:
      MODE: standalone
      # Local-only default. Shared deployments must set auth and non-placeholder credentials.
      NACOS_AUTH_ENABLE: ${NACOS_AUTH_ENABLE:-false}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-CHANGE_ME_NACOS_IDENTITY_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-CHANGE_ME_NACOS_IDENTITY_VALUE}
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-CHANGE_ME_NACOS_AUTH_TOKEN}
    expose: ["8848", "9848"]
    depends_on: *security_check_depends
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8848/nacos/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
  auth-system:
    build: { context: ./backend, dockerfile: Dockerfile, args: { MODULE: geek-auth-system } }
    environment:
      MYSQL_URL: jdbc:mysql://mysql:3306/geek_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      MYSQL_USER: ${MYSQL_USER:-geek}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-CHANGE_ME_MYSQL_PASSWORD}
      REDIS_HOST: redis
      NACOS_ADDR: nacos:8848
      JWT_SECRET: ${JWT_SECRET:-CHANGE_ME_JWT_SECRET_AT_LEAST_32_BYTES}
    expose: ["9001"]
    depends_on:
      <<: *security_check_depends
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      nacos: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9001'"]
      interval: 15s
      timeout: 5s
      retries: 20
  gateway:
    build: { context: ./backend, dockerfile: Dockerfile, args: { MODULE: geek-gateway } }
    environment:
      AUTH_SERVICE_URI: http://auth-system:9001
      PRODUCT_SERVICE_URI: http://merchant-product:9002
      INVENTORY_SERVICE_URI: http://inventory-fulfillment:9003
      SEARCH_SERVICE_URI: http://search-recommend:9004
      TRADE_SERVICE_URI: http://trade:9005
      MEMBER_SERVICE_URI: http://member:9006
      MARKETING_SERVICE_URI: http://marketing:9007
      AFTERSALE_SERVICE_URI: http://aftersale:9008
      SERVICE_CENTER_URI: http://service-center:9009
      SETTLEMENT_SERVICE_URI: http://settlement:9010
      AI_SERVICE_URI: ${AI_SERVICE_URI:-http://ai:9011}
      REDIS_HOST: redis
      NACOS_ADDR: nacos:8848
      JWT_SECRET: ${JWT_SECRET:-CHANGE_ME_JWT_SECRET_AT_LEAST_32_BYTES}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:*,http://127.0.0.1:*}
    expose: ["8080"]
    depends_on:
      <<: *security_check_depends
      auth-system: { condition: service_healthy }
      merchant-product: { condition: service_healthy }
      inventory-fulfillment: { condition: service_healthy }
      search-recommend: { condition: service_healthy }
      trade: { condition: service_healthy }
      member: { condition: service_healthy }
      marketing: { condition: service_healthy }
      aftersale: { condition: service_healthy }
      service-center: { condition: service_healthy }
      settlement: { condition: service_healthy }
      ai: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 15s
      timeout: 5s
      retries: 20
