server.port: ${TRADE_PORT:9005}
spring:
  application.name: geek-trade
  datasource:
    url: ${TRADE_MYSQL_URL:jdbc:mysql://localhost:3306/geek_trade?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${MYSQL_USER:geek}
    password: ${MYSQL_PASSWORD:geek_local_password}
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:geek}
    password: ${RABBITMQ_PASSWORD:geek_local_password}
    publisher-confirm-type: correlated
  cloud.nacos.discovery.server-addr: ${NACOS_ADDR:localhost:8848}
geek:
  auth:
    jwt-secret: ${JWT_SECRET:change-this-local-secret-at-least-32-bytes-long}
    issuer: geek-mall
  internal-key: ${INTERNAL_SERVICE_KEY:CHANGE_ME_INTERNAL_SERVICE_KEY}
  product-service-url: ${PRODUCT_SERVICE_URL:http://localhost:9002}
  inventory-service-url: ${INVENTORY_SERVICE_URL:http://localhost:9003}
  marketing-service-url: ${MARKETING_SERVICE_URL:http://localhost:9007}
  member-service-url: ${MEMBER_SERVICE_URL:http://localhost:9006}
  settlement-service-url: ${SETTLEMENT_SERVICE_URL:http://localhost:9010}
  payment:
    merchant-no: ${PAYMENT_MERCHANT_NO:GEEK-MALL}
    callback-secret: ${PAYMENT_CALLBACK_SECRET:change-payment-callback-secret}
    wechat:
      enabled: ${PAYMENT_WECHAT_ENABLED:false}
    alipay:
      enabled: ${PAYMENT_ALIPAY_ENABLED:false}
  checkout-ttl-seconds: ${CHECKOUT_TTL_SECONDS:900}
  order-timeout-seconds: ${ORDER_TIMEOUT_SECONDS:1800}
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
logging.pattern.console: '{"timestamp":"%d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX}","level":"%p","service":"geek-trade","request_id":"%X{request_id:-}","message":"%replace(%msg){''[\r\n]'','' ''}"}%n'
