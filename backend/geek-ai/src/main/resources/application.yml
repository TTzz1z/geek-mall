server:
  port: ${AI_PORT:9011}
  servlet.encoding:
    charset: UTF-8
    enabled: true
    force: true
spring:
  application.name: geek-ai
  datasource:
    url: ${AI_MYSQL_URL:jdbc:mysql://localhost:3306/geek_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${MYSQL_USER:geek}
    password: ${MYSQL_PASSWORD:CHANGE_ME_MYSQL_PASSWORD}
  flyway.locations: classpath:db/migration
  cloud.nacos.discovery.server-addr: ${NACOS_ADDR:localhost:8848}
geek:
  auth.jwt-secret: ${JWT_SECRET:CHANGE_ME_JWT_SECRET_AT_LEAST_32_BYTES}
  internal-key: ${INTERNAL_SERVICE_KEY:CHANGE_ME_INTERNAL_SERVICE_KEY}
  product-service-url: ${PRODUCT_SERVICE_URL:http://localhost:9002}
  trade-service-url: ${TRADE_SERVICE_URL:http://localhost:9005}
  search-service-url: ${SEARCH_SERVICE_URL:http://localhost:9004}
  aftersale-service-url: ${AFTERSALE_SERVICE_URL:http://localhost:9008}
  elasticsearch-url: ${ELASTICSEARCH_URL:http://localhost:9200}
  knowledge:
    tika-url: ${TIKA_URL:http://localhost:9998}
    minio-endpoint: ${MINIO_ENDPOINT:http://localhost:9100}
    minio-bucket: ${MINIO_BUCKET:geek-product-documents}
    minio-access-key: ${MINIO_ACCESS_KEY:geek}
    minio-secret-key: ${MINIO_SECRET_KEY:CHANGE_ME_MINIO_SECRET_KEY}
    embedding-url: ${EMBEDDING_URL:}
    embedding-model: ${EMBEDDING_MODEL:Qwen/Qwen3-Embedding-0.6B}
    embedding-key: ${EMBEDDING_API_KEY:}
    index: ${KNOWLEDGE_INDEX:geek-knowledge-v2}
  llm:
    enabled: ${LLM_ENABLED:true}
    base-url: ${LLM_BASE_URL:https://api.deepseek.com}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:deepseek-v4-flash}
    timeout-ms: ${LLM_TIMEOUT_MS:60000}
    planner-enabled: ${LLM_PLANNER_ENABLED:true}
    planner-timeout-ms: ${LLM_PLANNER_TIMEOUT_MS:12000}
    planner-max-tool-steps: ${LLM_PLANNER_MAX_TOOL_STEPS:5}
    replan-enabled: ${LLM_REPLAN_ENABLED:true}
    plan-cache-enabled: ${LLM_PLAN_CACHE_ENABLED:true}
    plan-cache-ttl-ms: ${LLM_PLAN_CACHE_TTL_MS:60000}
    planner-max-concurrent: ${LLM_PLANNER_MAX_CONCURRENT:4}
    planner-acquire-timeout-ms: ${LLM_PLANNER_ACQUIRE_TIMEOUT_MS:50}
  model:
    primary: ${AI_MODEL_PRIMARY:${LLM_MODEL:deepseek-v4-flash}}
    fallback: ${AI_MODEL_FALLBACK:geek-chat-fallback}
    fail-primary: ${AI_MODEL_FAIL_PRIMARY:false}
management.endpoints.web.exposure.include: health,info,prometheus
management.tracing.sampling.probability: ${AI_TRACE_SAMPLE_RATE:0.0}
management.otlp.tracing.endpoint: ${AI_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
management.opentelemetry.resource-attributes.service.name: geek-ai
