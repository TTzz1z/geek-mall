server.port: ${INVENTORY_PORT:9003}
spring:
  application.name: geek-inventory-fulfillment
  datasource:
    url: ${INVENTORY_MYSQL_URL:jdbc:mysql://localhost:3306/geek_inventory?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${MYSQL_USER:geek}
    password: ${MYSQL_PASSWORD:CHANGE_ME_MYSQL_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:geek}
    password: ${RABBITMQ_PASSWORD:CHANGE_ME_RABBITMQ_PASSWORD}
  cloud.nacos.discovery.server-addr: ${NACOS_ADDR:localhost:8848}
geek.auth:
  jwt-secret: ${JWT_SECRET:CHANGE_ME_JWT_SECRET_AT_LEAST_32_BYTES}
  issuer: geek-mall
geek.internal-key: ${INTERNAL_SERVICE_KEY:CHANGE_ME_INTERNAL_SERVICE_KEY}
geek.aftersale-service-url: ${AFTERSALE_SERVICE_URL:http://localhost:9008}
geek.trade-service-url: ${TRADE_SERVICE_URL:http://localhost:9005}
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
