server.port: ${SEARCH_PORT:9004}
spring:
  application.name: geek-search-recommend
  datasource:
    url: ${SEARCH_MYSQL_URL:jdbc:mysql://localhost:3306/geek_search?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${MYSQL_USER:geek}
    password: ${MYSQL_PASSWORD:geek_local_password}
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:geek}
    password: ${RABBITMQ_PASSWORD:geek_local_password}
    listener.simple:
      acknowledge-mode: auto
      retry.enabled: true
      retry.initial-interval: 1000
      retry.multiplier: 2
      retry.max-attempts: 5
      retry.max-interval: 30000
      default-requeue-rejected: false
  cloud.nacos.discovery.server-addr: ${NACOS_ADDR:localhost:8848}
geek:
  auth:
    jwt-secret: ${JWT_SECRET:change-this-local-secret-at-least-32-bytes-long}
    issuer: geek-mall
  elasticsearch-url: ${ELASTICSEARCH_URL:http://localhost:9200}
  product-service-url: ${PRODUCT_SERVICE_URL:http://localhost:9002}
  internal-key: ${INTERNAL_SERVICE_KEY:CHANGE_ME_INTERNAL_SERVICE_KEY}
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
