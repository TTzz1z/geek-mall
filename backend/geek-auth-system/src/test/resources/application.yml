spring:
  datasource:
    url: jdbc:h2:mem:geek_system;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  cloud:
    nacos:
      discovery:
        enabled: false
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 2s
      repositories:
        enabled: false
  flyway:
    enabled: true

geek:
  auth:
    jwt-secret: unit-test-secret-must-have-at-least-thirty-two-bytes
    issuer: geek-mall-test
    access-ttl: 15m
    refresh-ttl: 7d

management:
  health:
    redis:
      enabled: false
