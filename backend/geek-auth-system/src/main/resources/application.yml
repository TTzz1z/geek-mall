server:
  port: ${AUTH_PORT:9001}

spring:
  application:
    name: geek-auth-system
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/geek_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${MYSQL_USER:geek}
    password: ${MYSQL_PASSWORD:geek_local_password}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        username: ${NACOS_USER:nacos}
        password: ${NACOS_PASSWORD:nacos}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

geek:
  auth:
    jwt-secret: ${JWT_SECRET:change-this-local-secret-at-least-32-bytes-long}
    issuer: geek-mall
    access-ttl: 15m
    refresh-ttl: 7d

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX}","level":"%p","service":"geek-auth-system","request_id":"%X{request_id:-}","trace_id":"%X{trace_id:-}","logger":"%logger{36}","message":"%replace(%msg){''[\r\n]'','' ''}"}%n'
