name: phase-7-ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MAVEN_OPTS: -Xmx2g
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: geek_ai
          MYSQL_USER: ci_ai
          MYSQL_PASSWORD: ci-ai-fixture
          MYSQL_ROOT_PASSWORD: ci-root-fixture
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --silent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify backend unit/integration and migrations
        working-directory: backend
        run: mvn -B -ntp -T 1C -Pintegration verify
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Agent policy against the running application
        env:
          AI_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/geek_ai?allowPublicKeyRetrieval=true&useSSL=false
          MYSQL_USER: ci_ai
          MYSQL_PASSWORD: ci-ai-fixture
          LLM_ENABLED: 'false'
          AI_REDTEAM_URL: http://127.0.0.1:9011
          PROMPTFOO_DISABLE_TELEMETRY: '1'
        run: |
          export JWT_SECRET="$(openssl rand -hex 32)"
          export AI_REDTEAM_TOKEN="$(node e2e/ai-redteam/fixture-token.cjs)"
          echo "::add-mask::$AI_REDTEAM_TOKEN"
          java -jar backend/geek-ai/target/geek-ai-0.1.0-SNAPSHOT.jar \
            --spring.cloud.nacos.discovery.enabled=false --spring.cloud.discovery.enabled=false \
            > "$RUNNER_TEMP/geek-ai-redteam.log" 2>&1 &
          ai_pid=$!
          trap 'kill "$ai_pid" 2>/dev/null || true' EXIT
          if ! curl --fail --silent --show-error --retry 40 --retry-all-errors --retry-delay 1 "$AI_REDTEAM_URL/actuator/health"; then
            tail -n 80 "$RUNNER_TEMP/geek-ai-redteam.log"
            exit 1
          fi
          npx --yes promptfoo@0.125.1 eval --config e2e/ai-redteam/promptfooconfig.yaml --no-cache \
            --output "$RUNNER_TEMP/geek-ai-redteam.json"
          node -e 'const s=require(process.argv[1]).results.stats; if (!s.successes || s.failures || s.errors) process.exit(1)' \
            "$RUNNER_TEMP/geek-ai-redteam.json"
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.8.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Typecheck, test and build
        working-directory: frontend
        run: pnpm typecheck && pnpm test && pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
  compose-contract-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose definitions
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.test.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.observability.yml config --quiet
      - name: Contract schema samples
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          schema=json.loads(pathlib.Path('contracts/events/domain-event.schema.json').read_text(encoding='utf-8'))
          required=schema['required']; allowed=set(schema['properties']['eventType']['enum'])
          fail=0
          for p in pathlib.Path('contracts/events/samples').glob('*.json'):
            obj=json.loads(p.read_text(encoding='utf-8'))
            missing=[f for f in required if f not in obj]
            if missing or obj.get('eventType') not in allowed:
              print('FAIL', p, missing, obj.get('eventType')); fail+=1
            else:
              print('PASS', p.name)
          sys.exit(fail)
          PY
      - name: Dependency vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: '1'
